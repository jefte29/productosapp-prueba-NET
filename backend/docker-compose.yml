services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: productosapp-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin2026"  # SQL Server requiere mayúscula, minúscula y número para cumplir la política de seguridad
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Admin2026\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - productosapp-net

networks:
  productosapp-net:

volumes:
  sqlserver_data:
